<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuotaKeeper - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .offline-container {
      text-align: center;
      padding: 32px;
      max-width: 400px;
    }

    .offline-icon {
      font-size: 64px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    p {
      color: #a1a1aa;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    button {
      background-color: #dbfe01;
      color: #0d0d0d;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>You're Offline</h1>
    <p>QuotaKeeper is working offline. Your data is being saved locally and will sync when you're back online.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
